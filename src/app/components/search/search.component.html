<div class="search">
  <div class="stars" aria-hidden="true">
    @for (star of decorativeStars; track star.id) {
      <span class="star" [style]="star.style"></span>
    }
  </div>

  <div class="search__inner">
    <header class="search__header">
      <div class="search__logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <circle cx="14" cy="14" r="2.5" fill="white"/>
          <circle cx="5" cy="6" r="1.2" fill="white" opacity="0.6"/>
          <circle cx="23" cy="8" r="1.5" fill="white" opacity="0.8"/>
          <circle cx="22" cy="22" r="1" fill="white" opacity="0.5"/>
          <circle cx="7" cy="21" r="1.8" fill="white" opacity="0.7"/>
          <circle cx="14" cy="3" r="0.8" fill="white" opacity="0.4"/>
        </svg>
        <span>Stellar</span>
      </div>
      <p class="search__tagline">
        Cada commit, una estrella.<br>
        <em>Cada repositorio, un universo.</em>
      </p>
    </header>

    <form class="search__form" (submit)="onSubmit($event)">
      <div class="search__field" [class.search__field--error]="errorMsg()">
        <input
          type="text"
          class="search__input"
          placeholder="facebook/react"
          [value]="inputValue()"
          (input)="onInput($event)"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="Repositorio de GitHub"
        />
        @if (inputValue().length > 0) {
          <button class="search__clear" type="button" (click)="clear()" aria-label="Limpiar">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        }
      </div>

      @if (errorMsg()) {
        <p class="search__error" role="alert">{{ errorMsg() }}</p>
      }

      <button
        class="search__submit"
        type="submit"
        [disabled]="!inputValue().trim()"
      >
        Explorar universo
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <div class="search__examples">
      <span>Prueba con</span>
      @for (ex of examples; track ex) {
        <button class="search__example" (click)="useExample(ex)">{{ ex }}</button>
      }
    </div>
  </div>
</div>
